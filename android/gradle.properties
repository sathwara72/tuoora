org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
# Forces TLS 1.2 for Gradle's dependency downloads. Without this, some
# networks/antivirus HTTPS-scanning setups trigger a JVM-side TLS 1.3
# handshake bug that curl/browsers don't hit, surfacing as repeated
# "bad_record_mac" download failures for otherwise-healthy artifacts.
systemProp.https.protocols=TLSv1.2
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
